# STEEX Scheduler Configuration
# Controls when and how the trading pipeline runs via cron.
#
# IMPORTANT: Cron runs in system local time (PST on this machine).
# All schedule expressions are in PST. ET equivalents noted in comments.
# PST = ET - 3 hours (both coasts observe DST simultaneously).

# ---------------------------------------------------------------------------
# Defaults - applied to all modes unless overridden
# ---------------------------------------------------------------------------
defaults:
  paper: true
  dry_run: false
  auto_confirm: true
  agent: true                    # Use Claude AI agent mode (default: deterministic)

# ---------------------------------------------------------------------------
# Modes - each corresponds to a run_manager.py operating mode
# Schedule times are PST (system local). ET equivalents in comments.
# ---------------------------------------------------------------------------
modes:
  heartbeat_morning:
    enabled: true
    schedule: "0 4 * * 1-5"       # 4:00 AM PST = 7:00 AM ET, weekdays
    mode_name: "heartbeat"

  screen:
    enabled: true
    schedule: "15 5 * * 1-5"      # 5:15 AM PST = 8:15 AM ET, weekdays

  enter:
    enabled: true
    schedule: "45 6 * * 1-5"      # 6:45 AM PST = 9:45 AM ET, weekdays

  monitor_midday:
    enabled: true
    schedule: "0 8 * * 1-5"       # 8:00 AM PST = 11:00 AM ET, weekdays
    mode_name: "monitor"

  monitor_afternoon:
    enabled: true
    schedule: "30 10 * * 1-5"     # 10:30 AM PST = 1:30 PM ET, weekdays
    mode_name: "monitor"

  stop_sync:
    enabled: true
    schedule: "45 12 * * 1-5"     # 12:45 PM PST = 3:45 PM ET, weekdays

  post_market:
    enabled: true
    schedule: "30 13 * * 1-5"     # 1:30 PM PST = 4:30 PM ET, weekdays

  learning:
    enabled: true
    schedule: "0 15 * * 5"        # 3:00 PM PST = 6:00 PM ET, Fridays

  heartbeat_weekend:
    enabled: true
    schedule: "0 7 * * 0"         # 7:00 AM PST = 10:00 AM ET, Sundays
    mode_name: "heartbeat"

# ---------------------------------------------------------------------------
# Log retention
# ---------------------------------------------------------------------------
max_log_days: 30
