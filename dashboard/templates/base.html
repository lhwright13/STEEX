<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}STEEX{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x25C8;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><a href="/" class="brand">STEEX</a></li>
        </ul>
        <ul class="nav-links">
            <li><a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Overview</a></li>
            <li><a href="/runs" {% if request.path.startswith('/runs') %}aria-current="page"{% endif %}>Runs</a></li>
            <li><a href="/decisions" {% if request.path == '/decisions' %}aria-current="page"{% endif %}>Decisions</a></li>
            <li><a href="/screening" {% if request.path == '/screening' %}aria-current="page"{% endif %}>Screening</a></li>
            <li><a href="/risk" {% if request.path == '/risk' %}aria-current="page"{% endif %}>Risk</a></li>
            <li><a href="/status" {% if request.path == '/status' %}aria-current="page"{% endif %}>Status</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        STEEX Agent Dashboard &middot;
        <a href="https://app.alpaca.markets/paper/dashboard/overview" target="_blank" rel="noopener">Open Alpaca</a>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
