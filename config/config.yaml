# STEEX Strategy Configuration
# All parameters can be overridden via environment variables with STEEX_ prefix
# e.g., STEEX_INITIAL_STOP_PCT=0.10

# -----------------------------------------------------------------------------
# Momentum Parameters
# -----------------------------------------------------------------------------
momentum_lookback_days: 126      # 6 months lookback for momentum calculation
short_momentum_days: 21          # 1 month lookback for short-term momentum
momentum_min_return: 0.05        # Minimum 6-month return (5%)
short_momentum_min_return: 0.00  # Minimum 1-month return (0% - just not negative)
overextension_percentile: 0.95   # Top 5% excluded as overextended
overextension_filter_enabled: false  # Disabled - backtest showed better returns

# -----------------------------------------------------------------------------
# Moving Averages
# -----------------------------------------------------------------------------
ma_short: 50                     # Short-term moving average period
ma_long: 200                     # Long-term moving average period
require_dual_ma: false           # Require price above both MAs (false = only 50-day)

# -----------------------------------------------------------------------------
# Insider Trading Parameters
# -----------------------------------------------------------------------------
insider_lookback_days: 30        # Days to look back for insider activity
min_cluster_buyers: 3            # Minimum insiders for cluster buy signal
min_purchase_value: 100000       # Minimum purchase value for significant signal

# -----------------------------------------------------------------------------
# Universe Filter Parameters
# -----------------------------------------------------------------------------
min_price: 5.0                   # Minimum stock price
min_volume: 500000               # Minimum average daily volume
earnings_blackout_days: 5        # Days before earnings to avoid
min_history_days: 126            # Minimum trading history required (6 months)

# -----------------------------------------------------------------------------
# Position Management
# -----------------------------------------------------------------------------
max_positions: 10                # Optimized: concentrated portfolio outperforms
daily_picks: 2                   # Number of stocks to pick daily
position_size_pct: 0.04          # Base position size (4%)
max_sector_pct: 0.30             # Maximum sector exposure (30%)
max_single_position_pct: 0.10    # Maximum single position size (10%)
min_cash_reserve_pct: 0.10       # Minimum cash reserve (10%)

# -----------------------------------------------------------------------------
# Volatility-Adjusted Position Sizing
# -----------------------------------------------------------------------------
vol_sizing_enabled: true         # Enable volatility-adjusted position sizing
vol_low_threshold: 0.03          # ATR% threshold for low volatility (3%)
vol_med_threshold: 0.06          # ATR% threshold for medium volatility (6%)
vol_low_position_pct: 0.06       # Position size for low volatility stocks (6%)
vol_med_position_pct: 0.05       # Position size for medium volatility stocks (5%)
vol_high_position_pct: 0.03      # Position size for high volatility stocks (3%)

# -----------------------------------------------------------------------------
# Exit Parameters
# -----------------------------------------------------------------------------
initial_stop_pct: 0.10           # Optimized: tighter 10% stop (was 12%)
max_hold_days: 30                # Optimized: shorter hold (was 60) - forces rotation
dead_money_days: 10              # Days below entry before exit as dead money
dead_money_enabled: false        # Disabled - let stops handle exits
cooling_off_days: 14             # Trading days to block re-entry after stop-loss

# -----------------------------------------------------------------------------
# VIX Thresholds
# -----------------------------------------------------------------------------
vix_caution_level: 30            # VIX level to tighten stops
vix_exit_level: 40               # VIX level to exit 50% of positions
vix_tight_stop_pct: 0.05         # Tighter stop when VIX is elevated (5%)

# -----------------------------------------------------------------------------
# Trailing Stop Levels
# -----------------------------------------------------------------------------
trail_stop_10: 0.12              # Trail distance after 10% gain
trail_stop_20: 0.15              # Trail distance after 20% gain
trail_stop_30: 0.15              # Optimized: tighter at 30%+ (was 0.18) - lock in big gains

# -----------------------------------------------------------------------------
# Scoring Weights (must sum to 1.0)
# -----------------------------------------------------------------------------
weight_momentum: 0.30            # Momentum weight in score
weight_insider: 0.25             # Insider weight in score
weight_volume: 0.15              # Volume surge weight
weight_sentiment: 0.15           # Sentiment weight
weight_fundamental: 0.10         # Fundamental analysis weight
weight_options: 0.05             # Options intelligence weight

# -----------------------------------------------------------------------------
# Sentiment Analysis
# -----------------------------------------------------------------------------
geopolitical_enabled: true       # Enable geopolitical/macro sentiment
geopolitical_weight: 0.40        # Weight of geopolitical vs stock-specific sentiment
sentiment_stock_weight: 0.60     # Weight of stock-specific sentiment

# -----------------------------------------------------------------------------
# Fundamental Analysis
# -----------------------------------------------------------------------------
fundamental_enabled: true        # Enable fundamental analysis in screening
fundamental_max_pe: 50.0         # Maximum P/E ratio (filter out speculation)
fundamental_min_roe: 0.05        # Minimum ROE for quality filter (5%)
fundamental_max_debt_equity: 2.0 # Maximum debt/equity ratio
fundamental_cache_ttl: 86400     # Cache TTL in seconds (24 hours)

# -----------------------------------------------------------------------------
# Options Intelligence
# -----------------------------------------------------------------------------
options_enabled: true            # Enable options analysis in scoring
options_bullish_pc_threshold: 0.7  # Put/call ratio below this is bullish
options_bearish_pc_threshold: 1.0  # Put/call ratio above this is bearish
options_cache_ttl: 3600          # Cache TTL in seconds (1 hour)

# -----------------------------------------------------------------------------
# PySR Symbolic Regression (disabled by default)
# -----------------------------------------------------------------------------
pysr_enabled: false              # Enable PySR scoring in pipeline (requires trained model)
pysr_model_dir: "data/ml/models" # Directory for trained models
pysr_dataset_dir: "data/ml/datasets"  # Directory for training datasets
pysr_niterations: 40             # PySR search iterations
pysr_max_complexity: 25          # Max equation complexity in search
pysr_max_selected_complexity: 20 # Max complexity for selected equation
pysr_populations: 15             # PySR population count
pysr_parsimony: 0.0032           # Prefer simpler equations
pysr_timeout: 3600               # Training timeout in seconds
pysr_train_months: 12            # Walk-forward training window
pysr_val_months: 1               # Walk-forward validation window
pysr_walk_forward_folds: 6       # Number of walk-forward folds
weight_pysr: 0.10                # PySR weight in composite scoring

# -----------------------------------------------------------------------------
# Walk-Forward Backtest
# -----------------------------------------------------------------------------
walkforward_train_months: 6        # Training window in months
walkforward_test_months: 2         # Test window in months
walkforward_folds: 4               # Number of walk-forward folds
walkforward_signal_interval: 7     # Days between signal generations

# -----------------------------------------------------------------------------
# Portfolio Construction
# -----------------------------------------------------------------------------
portfolio_max_pairwise_corr: 0.70  # Maximum pairwise correlation for diversification
portfolio_risk_parity_enabled: true # Enable risk-parity weighting
portfolio_correlation_lookback: 60  # Lookback days for correlation matrix

# -----------------------------------------------------------------------------
# Multi-Factor Regime Detection
# -----------------------------------------------------------------------------
regime_multi_factor_enabled: true   # Enable multi-factor regime (vs VIX-only)
regime_vix_weight: 0.40            # VIX weight in composite score
regime_yield_weight: 0.20          # Yield curve weight
regime_breadth_weight: 0.20        # Market breadth weight
regime_other_weight: 0.20          # Dollar/other weight
regime_risk_off_threshold: 70      # Composite threshold for risk_off
regime_crisis_threshold: 85        # Composite threshold for crisis

# -----------------------------------------------------------------------------
# Post-Mortem Analysis
# -----------------------------------------------------------------------------
postmortem_enabled: true            # Enable post-mortem trade analysis
postmortem_lookback_days: 90        # Days of trade history to analyze

# -----------------------------------------------------------------------------
# Signal Research
# -----------------------------------------------------------------------------
research_significance_level: 0.05   # P-value threshold for significance
research_min_sample_size: 30        # Minimum samples for statistical testing
research_redundancy_threshold: 0.80 # Correlation threshold for redundancy
research_forward_return_days: 21    # Forward return horizon (trading days)

# -----------------------------------------------------------------------------
# Alpha Decay Monitoring
# -----------------------------------------------------------------------------
alpha_monitor_enabled: true         # Enable alpha decay checks
alpha_monitor_window: 30            # Rolling window for hit rate
alpha_degradation_threshold: 0.15   # Hit rate drop that triggers alert

# -----------------------------------------------------------------------------
# Execution Quality
# -----------------------------------------------------------------------------
execution_quality_enabled: true     # Enable execution quality tracking
execution_max_acceptable_slippage: 0.01  # Max acceptable slippage (1%)

# -----------------------------------------------------------------------------
# Data Prefetch
# -----------------------------------------------------------------------------
prefetch_enabled: true               # Prefetch data into cache before pipeline runs
prefetch_max_workers: 10             # Max concurrent workers
prefetch_price_days: 320             # Calendar days of price data (covers 200-day MA)
prefetch_sentiment_workers: 2        # Sentiment workers (respects Finnhub 60 req/min)
prefetch_fundamentals_workers: 3     # Fundamentals workers
prefetch_earnings_workers: 4         # Earnings calendar workers (low to avoid yfinance SQLite lock contention)

# -----------------------------------------------------------------------------
# Drawdown Rules
# -----------------------------------------------------------------------------
drawdown_review: 0.10            # Drawdown level to review strategy (10%)
drawdown_reduce: 0.15            # Drawdown level to reduce position sizes (15%)
drawdown_pause: 0.20             # Drawdown level to pause new entries (20%)
drawdown_exit: 0.25              # Drawdown level to exit all positions (25%)

# -----------------------------------------------------------------------------
# Transaction Costs (Alpaca)
# -----------------------------------------------------------------------------
# For small-cap stocks, real costs include bid-ask spread + PFOF:
#   - High volume (>1M): ~0.2% per trade
#   - Medium volume (100k-1M): ~0.5% per trade
#   - Low volume (<100k): ~1.0%+ per trade
# Using 0.5% as realistic default for mixed small-cap portfolio
estimated_cost_per_trade: 0.005  # 0.5% per trade (includes spread + PFOF)

# -----------------------------------------------------------------------------
# SQLite Cache
# -----------------------------------------------------------------------------
cache_db_path: "data/cache.db"   # SQLite cache database file path
cache_enabled: true              # Enable persistent SQLite cache for data providers

# -----------------------------------------------------------------------------
# Broker Settings
# -----------------------------------------------------------------------------
broker_enabled: true             # Broker always on - Alpaca is source of truth
broker_paper: true               # Use paper trading (default on, safety net)
# API keys come from environment variables only: ALPACA_API_KEY, ALPACA_SECRET_KEY

# Server-side stops (Alpaca GTC stop orders as crash-proof safety net)
server_stops_enabled: true       # Place GTC stops on Alpaca for each position
server_stop_offset_pct: 0.005    # Place server stop 0.5% below local stop (noise buffer)

# -----------------------------------------------------------------------------
# Data Paths
# -----------------------------------------------------------------------------
data_dir: "data"                 # Directory for cached data
positions_file: "positions.json" # File for position tracking
trades_file: "trades.json"       # File for trade log

# -----------------------------------------------------------------------------
# Learning Loop (Self-Optimizing Parameter Tuning)
# -----------------------------------------------------------------------------
learning_enabled: true               # Enable the self-learning loop
learning_dry_run: false              # Run learning without applying changes
learning_weight_change_cap: 0.10     # Max weight change per cycle (10%)
learning_min_trades_for_analysis: 15 # Min trades for reliable analysis
learning_oos_min_sharpe: 0.0         # Minimum OOS Sharpe for validation
learning_oos_min_win_rate: 0.50      # Minimum OOS win rate for validation
learning_feature_lookback_months: 2  # Months of feature data for research
learning_validation_train_months: 3  # OOS validation training window
learning_validation_test_months: 1   # OOS validation test window

# -----------------------------------------------------------------------------
# Manager Settings
# -----------------------------------------------------------------------------
manager_portfolio_value: 50000   # Total portfolio value for position sizing
manager_report_dir: "data/reports"  # Directory for daily reports
manager_max_daily_entries: 2     # Maximum new positions per day
manager_min_score_entry: 55.0    # Minimum composite score for entry
manager_require_insider: false   # Require insider activity for entry

# -----------------------------------------------------------------------------
# Agent Settings (Claude AI multi-agent mode)
# -----------------------------------------------------------------------------
agent_enabled: false              # Enable Claude AI agent mode globally
agent_max_turns: 15               # Maximum agentic turns per sub-agent
agent_timeout_seconds: 600        # Timeout for each agent invocation (10 min)
agent_fallback_deterministic: true  # Fall back to QuantManager if agent fails

# Agent trace and evolution
trace_retention_days: 30           # Days to keep agent session trace files
evolution_enabled: false           # Enable agent prompt self-improvement
evolution_max_rewrites_per_week: 1 # Max prompt rewrites per agent per week

# External MCP servers (supplement STEEX tools with third-party data)
# Each server requires its API key set as an environment variable.
mcp_alpaca_enabled: true           # Alpaca MCP: real-time quotes, order mgmt (uses ALPACA_API_KEY)
mcp_polygon_enabled: false         # Polygon MCP: aggregates, news, options flow (needs POLYGON_API_KEY)
mcp_alphavantage_enabled: true     # Alpha Vantage MCP: technical indicators, econ data (uses ALPHA_VANTAGE_API_KEY)
