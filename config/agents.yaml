# STEEX Agent Registry
# Declarative definitions of agents and mode sequences.
# Adding a new agent: add entry here, create prompt file, add conclusion model.
#
# external_servers: list of external MCP server names this agent can access.
# Available: alpaca (real-time quotes, orders), polygon (aggregates, news),
#            alphavantage (technical indicators, economic data)

agents:
  data:
    prompt: "data"
    conclusion: "DataConclusion"
    max_turns: 10
    needs_tools: true
    allowed_tools:
      - sync_broker
      - prefetch_data
      - refresh_data
      - check_data_health
    external_servers: [alpaca]

  risk:
    prompt: "risk"
    conclusion: "RiskConclusion"
    max_turns: 12
    needs_tools: true
    allowed_tools:
      - sync_broker
      - get_regime
      - assess_portfolio_risk
      - get_exit_signals
      - get_positions
      - get_account
    external_servers: [alpaca]

  analysis:
    prompt: "analysis"
    conclusion: "AnalysisConclusion"
    max_turns: 15
    needs_tools: true
    allowed_tools:
      - run_screening
      - rank_candidates
      - construct_portfolio
    external_servers: [alpaca, alphavantage, polygon]

  analysis_conservative:
    prompt: "analysis_conservative"
    conclusion: "AnalysisConclusion"
    max_turns: 15
    needs_tools: true
    allowed_tools:
      - get_regime
      - get_regime_screening_params
      - run_screening_variant
      - get_signal_confidence
      - rank_candidates_with_weights
      - get_unusual_options_activity
      - construct_portfolio
    external_servers: [alpaca, alphavantage, polygon]

  analysis_aggressive:
    prompt: "analysis_aggressive"
    conclusion: "AnalysisConclusion"
    max_turns: 15
    needs_tools: true
    allowed_tools:
      - get_regime
      - get_regime_screening_params
      - run_screening_variant
      - get_signal_confidence
      - rank_candidates_with_weights
      - get_unusual_options_activity
      - construct_portfolio
    external_servers: [alpaca, alphavantage, polygon]

  analysis_momentum:
    prompt: "analysis_momentum"
    conclusion: "AnalysisConclusion"
    max_turns: 15
    needs_tools: true
    allowed_tools:
      - get_regime
      - get_regime_screening_params
      - run_screening_variant
      - get_signal_confidence
      - rank_candidates_with_weights
      - get_unusual_options_activity
      - construct_portfolio
    external_servers: [alpaca, alphavantage, polygon]

  meta_analysis:
    prompt: "meta_analysis"
    conclusion: "MetaAnalysisConclusion"
    max_turns: 5
    needs_tools: false

  manager:
    prompt: "manager"
    conclusion: "ManagerDecision"
    max_turns: 3
    needs_tools: false

  execution:
    prompt: "execution"
    conclusion: "ExecutionConclusion"
    # 18, not 10: the exit chain added 3 tool calls (get_exit_signals ->
    # generate_sell_list -> execute_exits) and ToolSearch schema loads burn
    # ~3 more turns — the 07-06 enter run died at max_turns(10) mid-workflow
    # before it could execute exits or emit its conclusion.
    max_turns: 18
    needs_tools: true
    allowed_tools:
      - sync_broker
      - load_screen_results
      - size_buy_list
      - execute_entries
      # Exit chain: execute_exits hard-requires generate_sell_list, which
      # hard-requires get_exit_signals (per-process MCP state). Without all
      # three granted, every pipeline exit was permission-denied — audit
      # 2026-07-02 found exits_executed>0 in ZERO runs ever.
      - get_exit_signals
      - generate_sell_list
      - execute_exits
      - get_order_status
      - get_positions
      - get_account
    external_servers: [alpaca]

  research:
    prompt: "research"
    conclusion: "ResearchConclusion"
    max_turns: 10
    needs_tools: true
    allowed_tools:
      - run_postmortem
      - get_trade_history
    external_servers: [alphavantage, polygon]

  report:
    prompt: "report"
    conclusion: "ReportConclusion"
    max_turns: 5
    needs_tools: true
    allowed_tools:
      - generate_report
      - get_trade_history
    external_servers: [polygon]

  learning_agent:
    prompt: "learning"
    conclusion: "LearningConclusion"
    max_turns: 25
    needs_tools: true
    allowed_tools:
      - get_trade_history
      - run_postmortem
      - check_alpha_decay
      - propose_config_changes
      - apply_config_changes
      - get_learning_journal
      - get_learning_gaps
      - get_pending_recommendations
      - get_config_change_history
      - get_current_weights
      - cross_reference_findings
    external_servers: [alphavantage]

  learning_manager:
    prompt: "learning_manager"
    conclusion: "LearningManagerDecision"
    max_turns: 3
    needs_tools: false

  test_trader:
    prompt: "test_trader"
    conclusion: "TestTraderConclusion"
    max_turns: 8
    needs_tools: true
    allowed_tools:
      - place_paper_order
      - get_order_status
      - get_positions
      - get_account
    external_servers: [alpaca]

  event_review:
    prompt: "event_review"
    conclusion: "EventReviewConclusion"
    max_turns: 8
    needs_tools: true
    allowed_tools:
      - get_positions
      - get_account
      - get_exit_signals
      - generate_sell_list
      - execute_exits
      - get_regime
    external_servers: [alpaca, polygon]

modes:
  screen:
    sub_agents: [data, risk]
    parallel_agents: [analysis_conservative, analysis_aggressive, analysis_momentum]
    meta_agent: meta_analysis
    manager: manager
    critical_agents: [risk]
    post_actions: [save_screen, report]
    fallback: screen

  enter:
    sub_agents: [risk]
    manager: manager
    critical_agents: [risk]
    executor: execution
    pre_actions: [load_screen]
    post_actions: [report]
    fallback: enter

  monitor:
    sub_agents: [risk]
    manager: manager
    critical_agents: [risk]
    executor: execution
    post_actions: [report]
    fallback: monitor

  post_market:
    sub_agents: [risk, research]
    manager: manager
    critical_agents: [risk]
    executor: execution
    post_actions: [report]
    fallback: post_market

  learning:
    sub_agents: [learning_agent]
    manager: learning_manager
    critical_agents: [learning_agent]
    post_actions: [evolve_prompts, report]
    fallback: learning

  test_roundtrip:
    sub_agents: [test_trader]
    manager: ""             # no manager synthesis - the agent is self-contained
    critical_agents: [test_trader]
    fallback: test_roundtrip  # deterministic fallback in QuantManager

  event_scan:
    sub_agents: [event_review]   # review agent dispatched per fill by run_event_scan
    manager: ""                  # deterministic ingest+buy; review agent is self-contained
    critical_agents: []
    fallback: event_scan
