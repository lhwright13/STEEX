# STEEX Agent Registry
# Declarative definitions of agents and mode sequences.
# Adding a new agent: add entry here, create prompt file, add conclusion model.
#
# external_servers: list of external MCP server names this agent can access.
# Available: alpaca (real-time quotes, orders), polygon (aggregates, news),
#            alphavantage (technical indicators, economic data)

agents:
  data:
    prompt: "data"
    conclusion: "DataConclusion"
    max_turns: 10
    needs_tools: true
    allowed_tools:
      - sync_broker
      - prefetch_data
      - refresh_data
      - check_data_health
    external_servers: [alpaca]

  risk:
    prompt: "risk"
    conclusion: "RiskConclusion"
    max_turns: 12
    needs_tools: true
    allowed_tools:
      - sync_broker
      - get_regime
      - assess_portfolio_risk
      - get_exit_signals
      - get_positions
      - get_account
    external_servers: [alpaca]

  analysis:
    prompt: "analysis"
    conclusion: "AnalysisConclusion"
    max_turns: 15
    needs_tools: true
    allowed_tools:
      - run_screening
      - rank_candidates
      - construct_portfolio
    external_servers: [alpaca, alphavantage, polygon]

  manager:
    prompt: "manager"
    conclusion: "ManagerDecision"
    max_turns: 3
    needs_tools: false

  execution:
    prompt: "execution"
    conclusion: "ExecutionConclusion"
    max_turns: 10
    needs_tools: true
    allowed_tools:
      - sync_broker
      - load_screen_results
      - size_buy_list
      - execute_entries
      - execute_exits
      - get_order_status
      - get_positions
      - get_account
    external_servers: [alpaca]

  research:
    prompt: "research"
    conclusion: "ResearchConclusion"
    max_turns: 10
    needs_tools: true
    allowed_tools:
      - run_postmortem
      - get_trade_history
    external_servers: [alphavantage, polygon]

  report:
    prompt: "report"
    conclusion: "ReportConclusion"
    max_turns: 5
    needs_tools: true
    allowed_tools:
      - generate_report
      - get_trade_history
    external_servers: [polygon]

  learning_agent:
    prompt: "learning"
    conclusion: "LearningConclusion"
    max_turns: 25
    needs_tools: true
    allowed_tools:
      - get_trade_history
      - run_postmortem
      - check_alpha_decay
      - run_signal_research
      - validate_oos
      - propose_config_changes
      - apply_config_changes
      - get_learning_journal
      - get_learning_gaps
      - get_pending_recommendations
      - get_config_change_history
      - get_current_weights
      - cross_reference_findings
    external_servers: [alphavantage]

  learning_manager:
    prompt: "learning_manager"
    conclusion: "LearningManagerDecision"
    max_turns: 3
    needs_tools: false

  test_trader:
    prompt: "test_trader"
    conclusion: "TestTraderConclusion"
    max_turns: 8
    needs_tools: true
    allowed_tools:
      - place_paper_order
      - get_order_status
      - get_positions
      - get_account
    external_servers: [alpaca]

modes:
  screen:
    sub_agents: [data, risk, analysis]
    manager: manager
    critical_agents: [risk, analysis]
    post_actions: [save_screen, report]
    fallback: screen

  enter:
    sub_agents: [risk]
    manager: manager
    critical_agents: [risk]
    executor: execution
    pre_actions: [load_screen]
    post_actions: [report]
    fallback: enter

  monitor:
    sub_agents: [risk]
    manager: manager
    critical_agents: [risk]
    executor: execution
    post_actions: [report]
    fallback: monitor

  post_market:
    sub_agents: [risk, research]
    manager: manager
    critical_agents: [risk]
    executor: execution
    post_actions: [report]
    fallback: post_market

  learning:
    sub_agents: [learning_agent]
    manager: learning_manager
    critical_agents: [learning_agent]
    post_actions: [evolve_prompts, report]
    fallback: learning

  test_roundtrip:
    sub_agents: [test_trader]
    manager: ""             # no manager synthesis - the agent is self-contained
    critical_agents: [test_trader]
    fallback: test_roundtrip  # deterministic fallback in QuantManager
